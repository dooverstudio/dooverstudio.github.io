<!-- Fictional example concept — "Hendricks Roofing & Repair" is not a real client. Replace with a real screenshot once available. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Example contractor website design</title>
  <desc id="desc">Mockup of a redesigned contractor website for a fictional business called Hendricks Roofing and Repair, showing a split hero with a free estimate call to action and a services row</desc>

  <rect width="600" height="420" fill="#1B1F4B"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="600" height="30" fill="#12153B"/>
  <circle cx="18" cy="15" r="4.5" fill="#00E5FF" opacity="0.5"/>
  <circle cx="34" cy="15" r="4.5" fill="#00E5FF" opacity="0.35"/>
  <circle cx="50" cy="15" r="4.5" fill="#00E5FF" opacity="0.2"/>

  <!-- site nav -->
  <rect x="0" y="30" width="600" height="38" fill="#262B63"/>
  <text x="20" y="54" font-size="15" font-weight="700" fill="#F1F3FF">Hendricks Roofing &amp; Repair</text>
  <text x="512" y="53" font-size="12" font-weight="700" fill="#00E5FF">(317) 555-0142</text>

  <!-- hero: split layout -->
  <text x="20" y="106" font-size="10.5" fill="#00E5FF" font-weight="700">LICENSED &amp; INSURED SINCE 1998</text>
  <text x="20" y="140" font-size="22" font-weight="700" fill="#F1F3FF">Roofing done right,</text>
  <text x="20" y="166" font-size="22" font-weight="700" fill="#F1F3FF">the first time.</text>
  <text x="20" y="192" font-size="12" fill="#9BA3D4">Serving Indianapolis and the surrounding suburbs.</text>
  <rect x="20" y="206" width="180" height="32" rx="16" fill="#00E5FF"/>
  <text x="110" y="227" font-size="12" font-weight="700" fill="#12153B" text-anchor="middle">Get a Free Estimate</text>

  <rect x="330" y="86" width="250" height="160" rx="8" fill="#262B63"/>
  <path d="M355 200 L455 130 L555 200 Z" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
  <rect x="380" y="200" width="150" height="30" fill="none" stroke="#00E5FF" stroke-width="2"/>

  <!-- services row -->
  <rect x="20" y="264" width="135" height="86" rx="8" fill="#262B63"/>
  <rect x="163" y="264" width="135" height="86" rx="8" fill="#262B63"/>
  <rect x="306" y="264" width="135" height="86" rx="8" fill="#262B63"/>
  <rect x="449" y="264" width="131" height="86" rx="8" fill="#262B63"/>

  <text x="40" y="296" font-size="11.5" font-weight="700" fill="#F1F3FF">Roof Repair</text>
  <text x="40" y="316" font-size="9.5" fill="#9BA3D4">Leaks &amp; storm damage</text>

  <text x="183" y="296" font-size="11.5" font-weight="700" fill="#F1F3FF">New Roofs</text>
  <text x="183" y="316" font-size="9.5" fill="#9BA3D4">Full replacements</text>

  <text x="326" y="296" font-size="11.5" font-weight="700" fill="#F1F3FF">Gutters</text>
  <text x="326" y="316" font-size="9.5" fill="#9BA3D4">Install &amp; repair</text>

  <text x="469" y="296" font-size="11.5" font-weight="700" fill="#F1F3FF">Inspections</text>
  <text x="469" y="316" font-size="9.5" fill="#9BA3D4">Free &amp; same-week</text>

  <text x="20" y="380" font-size="11" fill="#9BA3D4">★★★★★ Rated 4.9 on Google - 120+ reviews</text>
  <text x="580" y="404" font-size="9.5" fill="#6B72A6" text-anchor="end" font-style="italic">Example concept - fictional business</text>
</svg>

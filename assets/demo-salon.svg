<!-- Fictional example concept — "Luxe Cuts Barbershop" is not a real client. Replace with a real screenshot once available. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Example salon and barbershop website design</title>
  <desc id="desc">Mockup of a redesigned barbershop website for a fictional business called Luxe Cuts Barbershop, showing a centered hero with a booking call to action and a gallery strip</desc>

  <rect width="600" height="420" fill="#1B1F4B"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="600" height="30" fill="#12153B"/>
  <circle cx="18" cy="15" r="4.5" fill="#00E5FF" opacity="0.5"/>
  <circle cx="34" cy="15" r="4.5" fill="#00E5FF" opacity="0.35"/>
  <circle cx="50" cy="15" r="4.5" fill="#00E5FF" opacity="0.2"/>

  <!-- site nav -->
  <rect x="0" y="30" width="600" height="38" fill="#262B63"/>
  <text x="20" y="54" font-size="16" font-weight="700" fill="#F1F3FF">Luxe Cuts Barbershop</text>
  <text x="420" y="53" font-size="11" fill="#9BA3D4">Services</text>
  <text x="480" y="53" font-size="11" fill="#9BA3D4">Gallery</text>
  <rect x="525" y="40" width="58" height="22" rx="11" fill="#00E5FF"/>
  <text x="554" y="55" font-size="10" font-weight="700" fill="#12153B" text-anchor="middle">Book</text>

  <!-- centered hero -->
  <circle cx="300" cy="128" r="42" fill="#262B63"/>
  <circle cx="300" cy="118" r="14" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path d="M280 148 Q300 132 320 148" fill="none" stroke="#00E5FF" stroke-width="2"/>

  <text x="300" y="200" font-size="22" font-weight="700" fill="#F1F3FF" text-anchor="middle">Sharp fades. No wait times.</text>
  <text x="300" y="222" font-size="12.5" fill="#9BA3D4" text-anchor="middle">Book your next cut online in under a minute.</text>
  <rect x="230" y="238" width="140" height="32" rx="16" fill="#00E5FF"/>
  <text x="300" y="259" font-size="12" font-weight="700" fill="#12153B" text-anchor="middle">Book Now</text>

  <!-- gallery strip -->
  <rect x="20" y="292" width="130" height="90" rx="8" fill="#262B63"/>
  <rect x="158" y="292" width="130" height="90" rx="8" fill="#262B63"/>
  <rect x="296" y="292" width="130" height="90" rx="8" fill="#262B63"/>
  <rect x="434" y="292" width="130" height="90" rx="8" fill="#262B63"/>

  <text x="300" y="400" font-size="11" fill="#9BA3D4" text-anchor="middle">Walk-ins welcome - Tue-Sat - 9am-7pm</text>
  <text x="580" y="404" font-size="9.5" fill="#6B72A6" text-anchor="end" font-style="italic">Example concept - fictional business</text>
</svg>
